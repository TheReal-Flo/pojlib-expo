<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classpath Dedupe</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --panel: #fffaf0;
      --ink: #1f1a17;
      --muted: #6c625a;
      --accent: #b85c38;
      --accent-2: #264653;
      --line: #d6c6b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(184, 92, 56, 0.12), transparent 28rem),
        linear-gradient(180deg, #f7f2ea 0%, #efe6da 100%);
      color: var(--ink);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.45;
    }

    .card {
      background: rgba(255, 250, 240, 0.9);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(38, 70, 83, 0.08);
      padding: 18px;
      margin-top: 18px;
      backdrop-filter: blur(10px);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 900px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 340px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      font: 14px/1.45 Consolas, "Courier New", monospace;
      background: #fffdf8;
      color: var(--ink);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: var(--accent);
    }

    button.secondary {
      background: var(--accent-2);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    code {
      background: rgba(38, 70, 83, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
    }

    ul {
      margin: 12px 0 0;
      padding-left: 18px;
    }

    li {
      margin: 6px 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <h1>Classpath Dedupe</h1>
    <p>
      Paste the current <code>classpath</code> value from
      <code>/storage/emulated/0/Android/data/dev.justfeli.pojlibexpo.example/files/instances.json</code>.
      This removes duplicate jar entries while preserving the original order.
    </p>

    <div class="card">
      <div class="row">
        <div>
          <label for="input">Input classpath</label>
          <textarea id="input" placeholder="Paste the full classpath here"></textarea>
        </div>
        <div>
          <label for="output">Deduped classpath</label>
          <textarea id="output" readonly placeholder="Deduped output will appear here"></textarea>
        </div>
      </div>

      <div class="actions">
        <button id="dedupe">Dedupe</button>
        <button id="copy" class="secondary">Copy Output</button>
        <button id="clear" class="secondary">Clear</button>
      </div>

      <div class="meta">
        <span id="summary">No input yet.</span>
      </div>
    </div>

    <div class="card">
      <label>Removed duplicates</label>
      <ul id="duplicates"></ul>
    </div>
  </main>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const duplicatesList = document.getElementById("duplicates");
    const summary = document.getElementById("summary");

    function detectSeparator(value) {
      if (value.includes(";") && !value.includes(":")) {
        return ";";
      }
      return ":";
    }

    function renderDuplicates(items) {
      duplicatesList.innerHTML = "";
      if (!items.length) {
        const li = document.createElement("li");
        li.textContent = "No duplicates found.";
        duplicatesList.appendChild(li);
        return;
      }

      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = item;
        duplicatesList.appendChild(li);
      }
    }

    function dedupeClasspath() {
      const raw = input.value.trim();
      if (!raw) {
        output.value = "";
        renderDuplicates([]);
        summary.textContent = "No input yet.";
        return;
      }

      const separator = detectSeparator(raw);
      const seen = new Set();
      const cleaned = [];
      const duplicates = [];

      for (const piece of raw.split(separator)) {
        const entry = piece.trim();
        if (!entry) {
          continue;
        }
        if (seen.has(entry)) {
          duplicates.push(entry);
          continue;
        }
        seen.add(entry);
        cleaned.push(entry);
      }

      output.value = cleaned.join(separator);
      renderDuplicates(duplicates);
      summary.textContent =
        `Entries: ${cleaned.length + duplicates.length}, removed duplicates: ${duplicates.length}, separator: "${separator}"`;
    }

    document.getElementById("dedupe").addEventListener("click", dedupeClasspath);
    document.getElementById("clear").addEventListener("click", () => {
      input.value = "";
      output.value = "";
      renderDuplicates([]);
      summary.textContent = "No input yet.";
    });
    document.getElementById("copy").addEventListener("click", async () => {
      if (!output.value) {
        return;
      }
      await navigator.clipboard.writeText(output.value);
      summary.textContent = "Deduped classpath copied to clipboard.";
    });
  </script>
</body>
</html>
