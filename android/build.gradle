plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.justfeli.pojlibexpo'
version = '0.1.0'

def pojlibAarName = 'Pojlib-release'
def pojlibAarFile = file("libs/${pojlibAarName}.aar")
def extractedPojlibJniDir = file("$buildDir/generated/pojlib-jni")
def sdl3AarName = 'SDL3-3.2.16'
def sdl3AarFile = file("libs/${sdl3AarName}.aar")
def extractedSdl3JniDir = file("$buildDir/generated/sdl3-jni")

if (!pojlibAarFile.exists()) {
  throw new GradleException("Missing ${pojlibAarFile.name} in android/libs. Copy the Pojlib AAR into android/libs before building Android.")
}

if (!sdl3AarFile.exists()) {
  throw new GradleException("Missing ${sdl3AarFile.name} in android/libs. Copy the SDL3 Android AAR into android/libs before building Android.")
}

tasks.register("extractPojlibJni") {
  inputs.file(pojlibAarFile)
  outputs.dir(extractedPojlibJniDir)

  doLast {
    delete(extractedPojlibJniDir)
    copy {
      from(zipTree(pojlibAarFile))
      into(extractedPojlibJniDir)
      include "jni/**"
    }
  }
}

tasks.register("extractSdl3Jni") {
  inputs.file(sdl3AarFile)
  outputs.dir(extractedSdl3JniDir)

  doLast {
    delete(extractedSdl3JniDir)

    [
      "armeabi-v7a": "prefab/modules/SDL3-shared/libs/android.armeabi-v7a/libSDL3.so",
      "arm64-v8a": "prefab/modules/SDL3-shared/libs/android.arm64-v8a/libSDL3.so",
      "x86": "prefab/modules/SDL3-shared/libs/android.x86/libSDL3.so",
      "x86_64": "prefab/modules/SDL3-shared/libs/android.x86_64/libSDL3.so",
    ].each { abi, sourcePath ->
      copy {
        from(zipTree(sdl3AarFile)) {
          include sourcePath
        }
        into(file("$extractedSdl3JniDir/jni/${abi}"))
        rename { "libSDL3.so" }
      }
    }
  }
}

android {
  namespace "dev.justfeli.pojlibexpo"
  defaultConfig {
    minSdkVersion 29
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    main {
      jniLibs.srcDirs += ["$buildDir/generated/pojlib-jni/jni"]
      jniLibs.srcDirs += ["$buildDir/generated/sdl3-jni/jni"]
    }
  }
}

tasks.named("preBuild").configure {
  dependsOn("extractPojlibJni")
  dependsOn("extractSdl3Jni")
}

dependencies {
  implementation(files(pojlibAarFile))

  implementation 'org.apache.commons:commons-math3:3.6.1'
  implementation 'com.google.guava:guava:31.0.1-jre'
  implementation 'org.jetbrains:annotations:24.0.1'
  implementation 'com.google.code.gson:gson:2.12.1'
  implementation 'org.json:json:20220924'
  implementation 'commons-io:commons-io:2.13.0'
  implementation 'commons-codec:commons-codec:1.15'
  implementation 'androidx.annotation:annotation:1.7.1'
  implementation 'androidx.core:core:1.13.1'
  implementation 'com.microsoft.azure:msal4j:1.17.2'
  implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
  implementation 'org.ow2.asm:asm:9.9'
  implementation 'org.ow2.asm:asm-tree:9.9'
}
